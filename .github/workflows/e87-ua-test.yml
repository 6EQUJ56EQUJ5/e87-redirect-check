name: e87 UA test

on:
  workflow_dispatch:

jobs:
  ua:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: claude-user
            ua: "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; Claude-User/1.0; +claude-user@anthropic.com)"
          - name: googlebot-plain
            ua: "Googlebot/2.1 (+http://www.google.com/bot.html)"
          - name: googlebot-desktop
            ua: "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; Googlebot/2.1; +http://www.google.com/bot.html) Chrome/127.0.0.0 Safari/537.36"
          - name: googlebot-smartphone
            ua: "Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          - name: no-os-token
            ua: "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36"
          - name: curl-default
            ua: "curl/8.5.0"
          - name: windows-chrome
            ua: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36"
          - name: iphone-safari
            ua: "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
    steps:
      - name: ${{ matrix.name }}
        shell: bash
        run: |
          set +e
          for u in "https://www.e87.com/selection/agedday/" "https://www.e87.com/selection/ohigan/" "https://www.e87.com/selection/autumn/" "https://www.e87.com/s/selection/agedday/"; do
            out=$(curl -sIL --max-redirs 10 -H "Accept: */*" -H "Accept-Encoding: gzip, deflate" -A "${{ matrix.ua }}" "$u")
            rc=$?
            chain=$(echo "$out" | grep -iE "^HTTP|^location" | tr -d '\r' | awk '{print $2}' | paste -sd' ')
            echo "ua=${{ matrix.name }} url=$u rc=$rc chain=[$chain]"
            if [ "$rc" = "47" ]; then echo "----- RAW -----"; echo "$out" | grep -iE "^HTTP|^location|^x-cache|^set-cookie" | tr -d '\r' | head -30; echo "---------------"; fi
          done
