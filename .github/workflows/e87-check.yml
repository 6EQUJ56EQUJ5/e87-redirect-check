name: e87 redirect check (US runner)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # 保険。通常は自己再起動で継続する

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: e87-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: poll every 10 min for ~5.5h
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          ACC="text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
          IP=$(curl -s https://ipinfo.io/ip)
          echo "== runner egress_ip=$IP start $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')"
          URLS="https://www.e87.com/selection/agedday/ https://www.e87.com/selection/ohigan/ https://www.e87.com/s/selection/agedday/ https://img.e87.com/selection/agedday https://img.e87.com/selection/ohigan"
          for i in $(seq 1 33); do
            TS=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')
            echo "===== round $i  $TS"
            for mode in plain browserlike; do
              if [ "$mode" = "plain" ]; then EXTRA=""; else EXTRA="--compressed -H Accept:$ACC -H Accept-Language:ja,en;q=0.8"; fi
              for u in $URLS; do
                out=$(curl -sIL --max-redirs 10 $EXTRA -A "$UA" "$u")
                rc=$?
                chain=$(echo "$out" | grep -iE "^HTTP|^location" | tr -d '\r' | awk '{print $2}' | paste -sd' ')
                xcache=$(echo "$out" | grep -i "^x-cache" | tr -d '\r' | awk -F': ' '{print $2}' | paste -sd'|')
                pop=$(echo "$out" | grep -i "^x-amz-cf-pop" | head -1 | awk '{print $2}' | tr -d '\r')
                echo "$TS ip=$IP mode=$mode url=$u rc=$rc pop=$pop xcache=[$xcache] chain=[$chain]"
                if [ "$rc" = "47" ] || echo "$chain" | grep -q "org.e87.com"; then
                  RAW=$(echo "$out" | grep -iE "^HTTP|^location|^x-cache|^x-amz-cf-pop|^set-cookie|^date" | tr -d '\r')
                  echo "----- ANOMALY -----"; echo "$RAW"; echo "-------------------"
                  BODY=$(printf 'time: %s\nsource_ip: %s\npop: %s\nmode: %s\nurl: %s\ncurl_exit: %s\nchain: %s\n\n```\n%s\n```\nrun: %s/actions/runs/%s' "$TS" "$IP" "$pop" "$mode" "$u" "$rc" "$chain" "$RAW" "$GITHUB_SERVER_URL/$GH_REPO" "$GITHUB_RUN_ID")
                  TITLE="[e87] anomaly $TS rc=$rc $u"
                  gh issue create --title "$TITLE" --body "$BODY" --label "anomaly" 2>/dev/null || gh issue create --title "$TITLE" --body "$BODY"
                fi
              done
            done
            [ "$i" -lt 33 ] && sleep 600
          done

      - name: re-dispatch next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run e87-check.yml --repo ${{ github.repository }}
