name: e87 redirect check (US runner)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: e87-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: poll every 10 min for ~5.5h (python GET, no HSTS)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          python3 - <<'PY'
          import http.client, ssl, os, subprocess, time, datetime, urllib.request
          from urllib.parse import urlsplit, urljoin
          UA = "Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          MODES = {
            "plain": {"Accept": "*/*"},
            "browserlike": {"Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8", "Accept-Encoding": "gzip, deflate, br", "Accept-Language": "ja,en;q=0.8"},
          }
          URLS = [
            "https://www.e87.com/selection/agedday/",
            "https://www.e87.com/selection/ohigan/",
            "https://www.e87.com/s/selection/agedday/",
            "https://www.e87.com/selection/agedday",
            "https://img.e87.com/selection/agedday",
            "https://img.e87.com/selection/ohigan",
          ]
          try:
            IP = urllib.request.urlopen("https://ipinfo.io/ip", timeout=10).read().decode().strip()
          except Exception as e:
            IP = "unknown"
          def now():
            return datetime.datetime.now(datetime.timezone.utc)
          def fetch(url, extra):
            u = urlsplit(url)
            host = u.hostname
            path = u.path or "/"
            if u.query:
              path += "?" + u.query
            if u.scheme == "https":
              conn = http.client.HTTPSConnection(host, timeout=20, context=ssl.create_default_context())
            else:
              conn = http.client.HTTPConnection(host, timeout=20)
            hdrs = {"Host": host, "User-Agent": UA}
            hdrs.update(extra)
            conn.request("GET", path, headers=hdrs)
            r = conn.getresponse()
            r.read()
            out = r.getheaders()
            conn.close()
            return r.status, out
          def chain(start, extra):
            hops = []
            url = start
            seen = set()
            for i in range(12):
              try:
                st, h = fetch(url, extra)
              except Exception as e:
                hops.append({"url": url, "error": str(e)})
                return hops, "error"
              d = {}
              for k, v in h:
                d[k.lower()] = v
              hops.append({"url": url, "status": st, "location": d.get("location"), "xcache": d.get("x-cache"), "pop": d.get("x-amz-cf-pop"), "cfid": d.get("x-amz-cf-id"), "cookie": (d.get("set-cookie") or "")[:70], "date": d.get("date"), "age": d.get("age")})
              loc = d.get("location")
              if st in (301, 302, 303, 307, 308) and loc:
                nxt = urljoin(url, loc)
                seen.add(url)
                if nxt in seen or len(hops) >= 11:
                  hops.append({"url": nxt, "note": "LOOP/limit"})
                  return hops, "loop"
                url = nxt
                continue
              return hops, "ok"
            return hops, "loop"
          def fmt(hops):
            parts = []
            for h in hops:
              if "error" in h:
                parts.append("ERR(" + h["error"][:40] + ")")
              elif "note" in h:
                parts.append("-> " + h["url"] + " " + h["note"])
              else:
                parts.append(str(h["status"]) + " " + h["url"])
            return " | ".join(parts)
          print("== runner egress_ip=" + IP + " start " + now().strftime("%Y-%m-%dT%H:%M:%SZ"), flush=True)
          for rnd in range(1, 34):
            ts = now().strftime("%Y-%m-%dT%H:%M:%SZ")
            tsj = (now() + datetime.timedelta(hours=9)).strftime("%H:%M:%S")
            print("===== round " + str(rnd) + "  " + ts + " (" + tsj + " JST)", flush=True)
            for mode, extra in MODES.items():
              for u in URLS:
                hops, res = chain(u, extra)
                pops = ",".join(sorted(set(h.get("pop") or "" for h in hops if h.get("pop"))))
                xc = "|".join((h.get("xcache") or "-").replace(" from cloudfront", "") for h in hops if "status" in h)
                cf = "|".join(h.get("cfid") or "-" for h in hops if "status" in h)
                print(ts + " ip=" + IP + " mode=" + mode + " url=" + u + " result=" + res + " pop=" + pops + " xcache=[" + xc + "] chain=[" + fmt(hops) + "] cfid=[" + cf + "]", flush=True)
                anom = (res == "loop")
                if u.startswith("https://www.e87.com/") and any("org.e87.com" in (h.get("url") or "") for h in hops):
                  anom = True
                if anom:
                  raw = []
                  for h in hops:
                    raw.append(str(h))
                  fence = chr(96) * 3
                  body = "time_utc: " + ts + chr(10) + "time_jst: " + tsj + chr(10) + "source_ip: " + IP + chr(10) + "mode: " + mode + chr(10) + "method: GET (python, no HSTS)" + chr(10) + "url: " + u + chr(10) + "result: " + res + chr(10) + "chain: " + fmt(hops) + chr(10) + chr(10) + fence + chr(10) + chr(10).join(raw) + chr(10) + fence + chr(10) + "run: " + os.environ.get("RUN_URL", "")
                  print("----- ANOMALY -----" + chr(10) + body + chr(10) + "-------------------", flush=True)
                  subprocess.run(["gh", "issue", "create", "--title", "[e87] anomaly " + ts + " " + res + " " + u, "--body", body])
            if rnd < 33:
              time.sleep(600)
          print("poll finished normally")
          PY
          echo "python exit=$?"
          true

      - name: re-dispatch next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run e87-check.yml --repo ${{ github.repository }}
